name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ml/requirements.txt
      # ml deps too: backend/tests/test_ml_integration.py runs against the real ml.api
      - run: pip install -r backend/requirements-dev.txt -r ml/requirements.txt
      - run: pytest backend

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: maqsad:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container (real ML required)
        run: |
          set -euo pipefail
          docker run -d --name maqsad -p 8000:8000 -e REQUIRE_REAL_ML=1 -e ADMIN_TOKEN=ci maqsad:ci
          # /api/health must answer right away; warm-up (portfolio build) runs in the background
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health > /dev/null && break; sleep 1; done
          for i in $(seq 1 90); do
            H=$(curl -fsS localhost:8000/api/health)
            [ "$(echo "$H" | jq -r .warmup)" != running ] && [ "$(echo "$H" | jq -r .warmup)" != pending ] && break
            sleep 2
          done
          echo "health: $H"
          echo "$H" | jq -e '.ml_mode == "real" and .warmup == "done" and ([.functions[]] | all(. == "real"))'

          # queue (contract v1.3): {items, total, counts}; no cookie -> fresh sandbox = default view
          curl -fsS "localhost:8000/api/queue?limit=50" -o queue.json
          jq -e '(.items | length) == 50 and .total > 0
                 and (.counts.red + .counts.yellow + .counts.green) == .total' queue.json
          LOAN=$(jq -r '.items[0].loan_id' queue.json)
          curl -fsS "localhost:8000/api/queue?color=red&limit=5" \
            | jq -e '(.items | length) > 0 and all(.items[]; .color == "red")'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8000/api/queue?limit=201')" = 422

          curl -fsS localhost:8000/api/queue/facets -o facets.json
          jq -e '(.regions | length) > 0 and (.purposes | length) > 0' facets.json
          REGION=$(jq -r '.regions[0]' facets.json)
          curl -fsS -G localhost:8000/api/queue --data-urlencode "region=$REGION" \
            | jq -e --arg r "$REGION" '.total > 0 and all(.items[]; .region == $r)'

          curl -fsS localhost:8000/api/queue/legend -o legend.json
          jq -e --slurpfile q queue.json '.n_loans == $q[0].total and .n_red_total == $q[0].counts.red
                 and .n_yellow_total == $q[0].counts.yellow and .red >= .yellow' legend.json

          curl -fsS "localhost:8000/api/loan/$LOAN" | jq -e '.model_version != "stub"'

          IMG=$(ls ml/assets/photos/*.jpg | head -n 1)
          curl -fsS -F "loan_id=$LOAN" -F "image=@$IMG;type=image/jpeg" localhost:8000/api/check_photo \
            | jq -e 'has("duplicate_of") and has("faces_blurred")'
          curl -fsS localhost:8000/ | grep -q '<div id="root">'

      - name: Container logs
        if: always()
        run: docker logs maqsad || true
