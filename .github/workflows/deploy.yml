name: Deploy

# main is always deployable: push to main -> tests -> Railway deploy (deploy history = Actions history)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend

  deploy:
    runs-on: ubuntu-latest
    needs: backend-tests
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check RAILWAY_TOKEN secret
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @railway/cli
      - run: railway up --service maqsad --detach
